[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "touchrack"
version = "4.7.0"
description = "A touch-first, modular homelab console for physical Linux TTY displays."
readme = "README.md"
license = "MIT"
keywords = ["homelab", "tui", "linux", "tty", "textual", "touchscreen"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]
requires-python = ">=3.11"
dependencies = [
  "textual>=3.0,<8",
  "psutil>=6.0,<8",
  "evdev>=1.7,<2; sys_platform == 'linux'",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[project.scripts]
homelab-console = "homelab_console.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
homelab_console = ["*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
