name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Audit wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("touchrack-*.whl"))
          assert len(wheels) == 1, wheels

          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())

          assert "homelab_console/console.tcss" in names
          assert "homelab_console/nodes/runtime.py" in names
          assert "homelab_console/transports/ssh.py" in names
          assert "homelab_console/providers/remote.py" in names
          assert "homelab_console/providers/remote_storage.py" in names
          assert "homelab_console/providers/remote_containers.py" in names
          assert "homelab_console/providers/remote_disk_health.py" in names
          assert not any(name.startswith("tests/") for name in names)
          assert not any(name.endswith("config.yaml") for name in names)
          PY
      - name: Smoke-test built wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/touchrack-*.whl
          python -c 'import homelab_console; assert homelab_console.__version__ == "5.0.0"'
      - name: Preserve validated release wheel
        uses: actions/upload-artifact@v4
        with:
          name: touchrack-5.0.0-wheel
          path: dist/touchrack-*.whl
          if-no-files-found: error
          retention-days: 14
