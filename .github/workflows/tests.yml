name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Audit wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("touchrack-*.whl"))
          assert len(wheels) == 1, wheels

          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())

          assert "homelab_console/console.tcss" in names
          assert not any(name.startswith("tests/") for name in names)
          assert not any(name.endswith("config.yaml") for name in names)
          PY
